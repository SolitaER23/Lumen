name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: android/gradlew -p android :app:assembleDebug --no-daemon --stacktrace

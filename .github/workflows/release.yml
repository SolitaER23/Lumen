name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "LUMEN_KEYSTORE_BASE64 is missing"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/lumen-release.jks

      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: |
          printf 'storeFile=lumen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Unit tests
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed release
        run: android/gradlew -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature and checksum
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          sha256sum android/app/build/outputs/apk/release/app-release.apk | tee apk.sha256

      - name: Archive mapping
        run: cp android/app/build/outputs/mapping/release/mapping.txt mapping.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            apk.sha256
            certs.txt
            mapping.txt
